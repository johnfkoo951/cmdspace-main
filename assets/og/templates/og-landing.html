<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>CMDSPACE OG</title>
<style>
@font-face {
	font-family: "Pretendard";
	src: url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/Pretendard-Bold.otf") format("opentype");
	font-weight: 700;
}
@font-face {
	font-family: "Pretendard";
	src: url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/Pretendard-Regular.otf") format("opentype");
	font-weight: 400;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
	font-family: "SF Pro Display", "SF Pro Text", "Pretendard", system-ui, sans-serif;
	background: #fbfbfa;
	color: #0a0d0b;
	padding: 56px 64px 52px;
	display: grid;
	grid-template-rows: auto 1fr auto;
	border-top: 14px solid #134538;
}
.top { display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 700; }
.brand img { width: 48px; height: 48px; border-radius: 50%; }
.category { color: #134538; font-size: 17px; font-weight: 700; }
.main { align-self: center; max-width: 990px; }
h1 { font-size: 78px; line-height: 1.06; letter-spacing: 0; margin-bottom: 22px; }
h1 span { color: #134538; }
.lede { max-width: 920px; color: #4a544f; font-size: 23px; line-height: 1.48; }
.bottom { display: grid; grid-template-columns: repeat(4, 1fr) auto; gap: 0; align-items: end; border-top: 1px solid #d9ddda; padding-top: 20px; }
.metric { min-width: 0; padding-right: 24px; }
.metric strong { display: block; font-size: 25px; color: #0a0d0b; }
.metric span { display: block; margin-top: 4px; color: #69726d; font-size: 13px; }
.url { align-self: center; color: #134538; font: 600 16px "SF Mono", ui-monospace, monospace; border-bottom: 3px solid #E985A2; padding-bottom: 4px; }
</style>
</head>
<body>
	<div class="top">
		<div class="brand"><img src="logo-round.png" alt=""><span>CMDSPACE</span></div>
		<div class="category">기업 AX · Context Architecture</div>
	</div>
	<div class="main">
		<h1>AI가 일하게 만드는<br><span>지식 구조.</span></h1>
		<p class="lede">임원 교육·코칭으로 문제를 발견하고, 진단 → 부서 파일럿 → 조직 확산 → 운영체계로 연결합니다.</p>
	</div>
	<div class="bottom">
		<div class="metric"><strong>855명</strong><span>그룹 임원 대상 프로그램</span></div>
		<div class="metric"><strong>약 2,500명</strong><span>라이브 AI 시연</span></div>
		<div class="metric"><strong>1만여</strong><span>지식 파일</span></div>
		<div class="metric"><strong>9 / 6</strong><span>System Files / 공개</span></div>
		<div class="url">cmdspace.work</div>
	</div>
</body>
</html>
